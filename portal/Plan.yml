# Option 1:
Redux Store:
  - Simulation status
  - Config (active)
  - Form config dirtiness
  - Download URL
  - Data:
    - Run count
    - Update count for current run

Dumb Data Store:
  stats:
    fitness:
      - ...
    markers:
      - ...
    ...: ...

Flow:
  - options entered
  - form state dirtiness saved to redux store
  - run button pressed
  - submit on form triggered
  - redux action with payload to start simulations
  - redux saga middleware takes action
  - saga starts simulation handler:
    - periodically gets results from store
    - updates data revision state
  - new data revision triggers charts to update


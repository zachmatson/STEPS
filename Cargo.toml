cargo-features = ["edition2021"]

[package]
name = "steps"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = "thin"

[dependencies]
itertools = "0.10.0"
clap = { version = "3.2", features = ["derive"] }
indicatif = "0.15"
serde = "1.0"
serde_tuple = "0.5"
serde_json = "1.0"
csv = "1.1"
hashbrown = "0.9.1"
rand = "0.7"
rand_pcg = "0.2"
rand_distr = "0.2"
cty = "0.2.1"
anyhow = "1.0"
thiserror = "1.0"
slices_dispatch_wide = "0.1.1"
derive_builder = "0.11.2"

[dev-dependencies]
approx = "0.5.0"

[package]
name = "steps_adapter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
create_typescript_interface = { path = "./create_typescript_interface" }
steps = { git = "ssh://git@github.com/zachmatson/STEPS-Development.git" }
js-sys = "0.3.57"
web-sys = { version = "0.3", features = ["Blob", "Url"] }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
console_error_panic_hook = "0.1"
serde = "1.0"
serde-wasm-bindgen = "0.4.3"

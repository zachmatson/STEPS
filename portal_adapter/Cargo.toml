[package]
name = "steps_adapter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
steps = { path = "../../steps" }
serde = "1.0"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
web-sys = { version = "0.3", features = ["console", "Window"] }
console_error_panic_hook = "0.1"
paste = "1.0.6"
